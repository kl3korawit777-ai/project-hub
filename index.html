<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Project Hub · คลังโปรเจกต์</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#EAF0F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1828" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;700&family=IBM+Plex+Mono&family=IBM+Plex+Sans+Thai:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="./" aria-label="Project Hub">
      <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--primary)"/><path d="M9 22V10h6.5a3.5 3.5 0 010 7H9" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Project Hub</span>
    </a>
    <nav class="nav" aria-label="มุมมอง"><a id="nav-home" href="#" aria-current="page">ภาพรวม</a><a id="nav-links" href="#links">ลิงก์เว็บ</a></nav>
    <span id="count" class="muted mono small"></span>
    <input id="q" type="search" class="search" placeholder="ค้นหาชื่อ คำอธิบาย แท็ก" aria-label="ค้นหา" autocomplete="off">
    <button id="new" type="button">+ โปรเจกต์ใหม่</button>
    <button id="logout" type="button" class="ghost" hidden>ออก</button>
  </div>
  <div id="offline-bar" class="note-bar off" role="status" hidden>
    <span id="offline-text"></span><button id="offline-retry" type="button" class="ghost sm">ลองใหม่</button>
  </div>
  <div id="update-bar" class="note-bar upd" role="status" hidden>
    <span>มีเวอร์ชันใหม่</span><button id="update-btn" type="button" class="sm">รีเฟรช</button>
  </div>
</header>

<main>
  <p id="cfg-warn" class="warn" hidden>ยังไม่ได้ตั้งค่า js/config.js</p>

  <section id="login" class="card" hidden>
    <h2>ล็อกอิน</h2>
    <form id="form"><input id="email" type="email" required placeholder="อีเมล" autocomplete="email"><button>ส่งลิงก์ล็อกอิน</button></form>
    <p id="msg" class="muted"></p>
  </section>

  <section id="linksview" hidden>
    <div class="l-search">
      <input id="lq" type="text" inputmode="search" enterkeyhint="go" placeholder="ค้นหาชื่อหรือลิงก์…" aria-label="ค้นหาชื่อหรือลิงก์" autocomplete="off" spellcheck="false">
      <button id="lclear" type="button" class="l-clear" aria-label="ล้างคำค้น" hidden>✕</button>
    </div>
    <ul id="llist" class="l-list"></ul>
  </section>

  <section id="app" hidden>
    <div class="hero"><h1>คลังโปรเจกต์</h1><span id="today" class="muted"></span></div>
    <div id="chips" class="chips"></div>
    <div id="due"></div>
    <div id="gantt"></div>
    <div id="grid" class="grid"></div>
  </section>
</main>

<aside id="detail" class="detail" role="region" aria-label="รายละเอียดโปรเจกต์" hidden>
  <div class="d-bar"><button id="d-back" type="button" class="ghost">← กลับ</button></div>
  <div id="d-head"></div>
  <section id="d-links" class="d-sec"></section>
  <section id="d-sched" class="d-sec"></section>
  <section id="d-ms" class="d-sec"></section>
  <section id="d-ups" class="d-sec"></section>
</aside>

<div id="modal"class="modal" hidden><div id="sheet" class="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
